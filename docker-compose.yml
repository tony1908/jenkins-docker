services:
  jenkins:
    build:
      context: .
    image: local/jenkins-dind:latest
    container_name: jenkins
    restart: unless-stopped
    depends_on:
      docker:
        condition: service_healthy
      registry:
        condition: service_started
    environment:
      DOCKER_HOST: tcp://docker:2375
      DOCKER_TLS_CERTDIR: ""
      KUBECONFIG: /kube/minikube
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./kubeconfig:/kube:ro
      - ./sample-app:/workspace/sample-app:ro
      - ./svn:/svn
      - ./jenkins-init/create-local-build-job.groovy:/var/jenkins_home/init.groovy.d/create-local-build-job.groovy:ro
      - ./jenkins-init/create-svn-build-job.groovy:/var/jenkins_home/init.groovy.d/create-svn-build-job.groovy:ro
    networks:
      - jenkins
      - minikube

  docker:
    image: docker:dind
    container_name: jenkins-docker
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
      - --insecure-registry=registry:5000
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - docker_data:/var/lib/docker
      - jenkins_home:/var/jenkins_home
    networks:
      - jenkins

  registry:
    image: registry:2
    container_name: jenkins-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - registry_data:/var/lib/registry
    networks:
      jenkins:
        aliases:
          - registry
      minikube:
        aliases:
          - registry

volumes:
  jenkins_home:
  docker_data:
  registry_data:

networks:
  jenkins:
    name: jenkins
  minikube:
    external: true
    name: ${MINIKUBE_DOCKER_NETWORK:-minikube}
